conformance:
  spec: A2A 1.0.0
  grade: near-conformant
  protocol_version: '0.3.0'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT (streaming, pushNotifications,
    stateTransitionHistory), protocolVersion is present at the top level ("0.3.0"), and skills is an ARRAY
    of four skills each carrying id, name, description, tags, examples, inputModes and outputModes.
    preferredTransport is absent, so the card is graded near-conformant rather than conformant: an A2A
    client must assume the default JSONRPC binding for the declared url. defaultInputModes and
    defaultOutputModes are present.
  deviations:
  - field: preferredTransport
    observed: absent
    note: Optional in 0.3.0 (defaults to JSONRPC) but it is the discriminator between the two grades here.
  - field: authentication
    observed: 'legacy object {schemes: [apiKey], credentials: {signup_url, headers}}'
    note: >-
      This is the pre-0.3 AgentAuthentication shape. A2A 0.3.0 and 1.0.0 express auth as securitySchemes +
      security (OpenAPI-style). A 0.3-aware reader finds no securitySchemes and reads the card as
      unauthenticated, while the endpoint in fact requires two API-key headers and, at the gateway, an
      Authorization header the card never mentions.
  - field: securitySchemes / security
    observed: absent
    note: See authentication above; the credential requirement is carried only in the legacy block.
  - field: protocolVersion / url
    observed: 0.3.0 top-level pair; no supportedInterfaces[] or additionalInterfaces[]
    note: Valid for the declared 0.3.0 revision; a reader written against A2A 1.0.0 will not find supportedInterfaces[].protocolBinding.
  - field: documentationUrl / iconUrl / signatures
    observed: absent
    note: >-
      No documentation link (the provider publishes https://chilledsites.com/agents.md and
      https://chilledsites.com/docs/api, neither referenced from the card) and no JWS signature block, so
      authenticity rests on TLS to chilledsites.com.
  - field: skills[].security
    observed: absent on every skill
    note: Optional per-skill field.
  - field: skills[generate-media].description
    observed: names Gemini, Imagen 3, DALL-E 3 and Veo 3.1
    note: >-
      The provider's llms.txt (2026-06-30) and context.md name Veo 2 and Sora 2 for video, and the shipped
      MCP package's generate_video tool says Veo 3.1. The card and the prose disagree on the video model;
      recorded, not graded.
surface_relationship:
  note: >-
    ChilledSites publishes three agent surfaces that project one REST core (see mcp/chilledsites-com-mcp.yml
    and conventions/chilledsites-com-conventions.yml). A2A: four skills at
    https://api.chilledsites.com/functions/v1/a2a-agent. MCP: a hosted endpoint at
    https://api.chilledsites.com/functions/v1/chatgpt-mcp plus the stdio npm package @chilledsites/mcp-server
    (16 tools in v1.0.6). REST: https://api.chilledsites.com/functions/v1/api-v1 with the /v1/* paths
    documented at https://chilledsites.com/docs/api and https://chilledsites.com/agents.md. No OpenAPI is
    published for the REST core, so the crosswalk between the four A2A skills, the 16 MCP tools and the REST
    paths is recorded by name in the MCP manifest rather than in a ToolCrosswalk artifact.
