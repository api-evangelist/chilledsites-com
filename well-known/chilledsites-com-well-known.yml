summary: >-
  One real document is served, on the apex host: the A2A agent card at /.well-known/agent-card.json (and,
  byte-identical, at the legacy /.well-known/agent.json). It is credited through the AgentCard pointer and
  a2a/chilledsites-com-a2a.yml. Nothing else on the closed list is served anywhere — no security.txt, no
  OIDC discovery, no RFC 8414 or RFC 9728 OAuth metadata (on the primary host OR on the API/MCP/A2A host
  api.chilledsites.com), no api-catalog, no ai-plugin.json, no ucp/acp/aauth, no apis.json.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer are emitted. WellKnown feeds well_known_catalog, which
  credits an API catalog / security.txt / protected-resource document; the only served document here is
  the agent card, which has its own graded pointer (AgentCard). Emitting WellKnown on the strength of the
  agent card would score a catalog the provider does not publish.
false_positive_watch: >-
  chilledsites.com returns a real HTML 404 page (title "Site Not Available | ChilledSites", ~4.3 KB) for
  unknown paths — a negative-control path 404s, so its 200s are genuine. api.chilledsites.com (Supabase
  Edge Functions custom domain behind Cloudflare) answers every unrouted path with a JSON 404
  {"error":"requested path is invalid"}. www.chilledsites.com 308s every path to the apex.
  mcp.chilledsites.com, docs.chilledsites.com, app.chilledsites.com, status.chilledsites.com and
  developers.chilledsites.com do not resolve (NXDOMAIN); the MCP and A2A endpoints share api.chilledsites.com.
