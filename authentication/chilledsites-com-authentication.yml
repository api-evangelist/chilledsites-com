note: >-
  No OpenAPI is published, so this profile is read from the provider's documentation and from the request
  headers its own shipped MCP server sends. The authoritative scheme is a two-header API-key pair; two
  older pages describe a Bearer token instead (recorded under disagreements).
schemes:
- id: apiKeyPair
  type: apiKey
  in: header
  headers:
  - name: X-API-Key
    format: 'cs_live_... (prefix documented in agents.md and /docs/api)'
  - name: X-API-Secret
    format: 'cs_secret_... (prefix documented in agents.md and /docs/api)'
  applies_to: every REST call on https://api.chilledsites.com/functions/v1/api-v1, every MCP tool call (stdio server forwards both headers), and the A2A endpoint per the agent card
  issuance:
  - channel: dashboard
    steps: Sign in > profile avatar > Settings > API Keys tab > Generate New API Key > name + permissions > Create; key and secret are shown once.
    permissions_at_creation: [Read, Write, Deploy]
    docs: https://chilledsites.com/docs/api#authentication
  - channel: agent self-signup
    endpoint: POST https://api.chilledsites.com/functions/v1/agent-signup
    content_type: application/json
    body_fields_documented:
      agents_md: [agent_name, agent_type, contact_email]
      for_agents: [email, source]
      developers: [email, agent_name]
    returns: '{ api_key, api_secret } immediately; account starts at zero tokens'
    probe: "GET returned 405 {\"error\":\"Method not allowed\"} with Access-Control-Allow-Methods POST, OPTIONS -- live, POST-only. Not called with POST (it would create an account)."
    docs: https://chilledsites.com/for-agents
  gateway_note: >-
    The hosted MCP endpoint (/functions/v1/chatgpt-mcp) and the A2A endpoint (/functions/v1/a2a-agent)
    additionally return 401 {"code":"UNAUTHORIZED_NO_AUTH_HEADER"} to any request without an Authorization
    header — the Supabase Edge Functions gateway check — which no provider document mentions. The REST
    base (/functions/v1/api-v1) does NOT apply that check: an anonymous request reaches the API and gets
    the API's own 401 envelope {"success":false,"error":{"code":"UNAUTHORIZED","message":"Invalid or
    missing API credentials"}}.
unauthenticated_response:
  status: 401
  body: '{"success":false,"error":{"code":"UNAUTHORIZED","message":"Invalid or missing API credentials"},"meta":{"timestamp":"2026-09-20T01:32:42.436Z","version":"v1"}}'
  observed_on: GET https://api.chilledsites.com/functions/v1/api-v1/v1/websites
  cors: 'access-control-allow-origin: *; access-control-allow-headers: x-api-key, x-api-secret, content-type, authorization; access-control-allow-methods: GET, POST, PUT, DELETE, OPTIONS'
authorization:
  model: per-key permissions chosen at creation (Read, Write, Deploy); 403 FORBIDDEN when a key lacks the permission
  billing_gate: paid routes (upload, update, deploy, and every generation) additionally require tokens or a paid account — 402 INSUFFICIENT_TOKENS otherwise (see errors/ and conventions/)
oauth2: none
openid_connect: none
mutual_tls: none
