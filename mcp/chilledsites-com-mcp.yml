sources:
- url: https://chilledsites.com/mcp.json
  note: Provider-published MCP manifest (13 tools, endpoint, protocol mcp-http, npm package). Saved verbatim as mcp/chilledsites-com-mcp.json.
- url: https://registry.npmjs.org/@chilledsites/mcp-server
  note: npm registry metadata — latest 1.0.6 published 2025-12-03, author "ChilledSites", homepage https://chilledsites.com, repository github.com/paulgosnell/chilledsites-v3 (mcp-server/), which is private (GitHub API 404).
- url: https://registry.npmjs.org/@chilledsites/mcp-server/-/mcp-server-1.0.6.tgz
  note: The published tarball ships src/index.ts. The 16 tool definitions with their full inputSchema were read from it and saved as mcp/chilledsites-com-mcp-tools.json — a tools/list equivalent taken from the provider's own shipped code, not authored here.
