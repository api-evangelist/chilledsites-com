aid: chilledsites-com
name: ChilledSites
description: >-
  ChilledSites is a UK-built AI website builder (by p0stman) that generates, edits and deploys complete
  small-business websites from a text prompt, with hosting, custom domains, contact forms, an AI chatbot,
  reviews and analytics included from GBP 9 a month. It is unusually agent-native for its size: a REST API
  at api.chilledsites.com (websites CRUD, deploy, image/video/ad generation, token balance) behind a
  two-header API key, an A2A agent card at /.well-known/agent-card.json, a hosted MCP endpoint plus the
  @chilledsites/mcp-server npm package (16 tools), agent self-signup with no human step, and a 402
  token-billing flow that emails the account owner a payment link so an agent can resume after a human
  pays. Discovery files (llms.txt, context.md, agents.md, mcp.json, agent-meta.json) are published at the
  domain root. No OpenAPI, status page, changelog or deprecation policy is published.
