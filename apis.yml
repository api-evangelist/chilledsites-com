apis:
- name: ChilledSites REST API v1
  description: >-
    Generate a website from a prompt, upload custom code, list/get/update/delete websites, deploy to a
    .chilledsites.com subdomain, generate images, videos and ad creative, check the token balance and
    trigger the email-checkout top-up. JSON envelope on every response (success/data|error/meta), API-key
    pair in X-API-Key + X-API-Secret, X-RateLimit-* headers, 402 INSUFFICIENT_TOKENS with a machine-readable
    body when the balance is short. The provider publishes no OpenAPI; the paths are documented in prose at
    /docs/api and /agents.md and confirmed by the shipped MCP server source. Note the /docs/api page names a
    base of https://api.chilledsites.com/v1 that returns 404 — the live base is the one recorded here.
  image: https://chilledsites.com/img/logo.svg
  humanURL: https://chilledsites.com/docs/api
